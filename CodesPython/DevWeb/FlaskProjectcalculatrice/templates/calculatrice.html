<!DOCTYPE html>
<html>
<head>
    <title>Calculatrice</title>
</head>
<body>
    <h1>Calculatrice Simple</h1>
    <form method = "post" action="calculate"> <br>
       <input type="number" name="num1" placeholder="premier nombre" required>
       <input type="number" name="num2" placeholder="deuxième nombre" required>
       <select name="operation">
              <option value="add">Addition (+)</option>
              <option value="subtract">Soustraction (-)</option>
              <option value="multiply">Multiplication (*)</option>
              <option value="divide">Division (/)</option>
              <option value="power">Puissance (^)</option>
         </select>
         <button type="submit">Calculer</button>        
     </form>
        {% if result is defined %}
            <h2>Résultat: {{ result }}</h2>
        {% endif %}
</body>
</html>
