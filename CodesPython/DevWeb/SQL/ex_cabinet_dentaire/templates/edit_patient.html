<!DOCTYPE html>
<head>
    <title>Modifier un patient</title>
</head>
<body>

<h1>Modifier un patient</h1>

<nav>
    <a href="/patients">Voir les patients</a>
</nav> 
<form method="POST" action="{{ url_for('edit_patient', id_patient=patient[0]) }}">
    <label for="nom_patient">Nom :</label>
    <input type="text" id="nom_patient" name="nom_patient" value="{{ patient[1] }}" required>
    <label for="date_naissance">Date de naissance :</label>
    <input type="date" id="date_naissance" name="date_naissance" value="{{ patient[2] }}" required>
    <label for="telephone">telephone :</label>
    <input type="text" id="telephone" name="telephone" value="{{ patient[3] }}" required>
    <label for="email">email :</label>
    <input type="email" id="email" name="email" value="{{ patient[4] }}" required>
    <button type="submit">Modifier</button>
</form>
