<!DOCTYPE html>
<head>
    <title>Patients</title>
</head>
<body>
    <nav><a href="/Accueil">Retour à l'accueil</a></nav>
    <h1>Liste des patients</h1>
    {% if x== True %}
    <button><a href="/add_patient">Ajouter un patient</a></button>
    {% endif %}
    <table border="1">
        <tr>
            <th>Id_patient</th>
            <th>nom_patient</th>
            <th>date_naissance</th>
            <th>telephone</th>
            <th>email</th>
        </tr>
        {% for patient in patients %}
        <tr>
            <td>{{ patient[0] }}</td>
            <td>{{ patient[1] }}</td>
            <td>{{ patient[2] }}</td>
            <td>{{ patient[3] }}</td>
            <td>{{ patient[4] }}</td>
            <td>
                <a href="/edit_patient/{{ patient[0] }}">Modifier</a>
                <a href="/delete_patient/{{ patient[0] }}">Supprimer</a>
            </td>

        </tr>
        {% endfor %}
    </table>
</body>
</html>
