<!DOCTYPE html>
<head>
    <title>Modifier un rendez-vous</title>
</head>
<body>

<h1>Modifier un rendez-vous</h1>

<nav>
    <a href="/appointments">Voir les rendez-vous</a>
</nav> 
<form method="POST" action="{{ url_for('edit_appointment', id=appointment[0]) }}">
    <label for="patient_id">Patient :</label>
    <select id="patient_id" name="patient_id" required>
        {% for p in patients %}
            <option value="{{ p[0] }}" {% if p[0] == appointment[0] %}selected{% endif %}>{{ p[1] }}</option>
        {% endfor %}
    </select>
    <label for="dentiste_id">Dentiste :</label>
    <select id="dentiste_id" name="dentiste_id" required>
        {% for d in dentistes %}
            <option value="{{ d[0] }}" {% if d[0] == appointment[1] %}selected{% endif %}>{{ d[1] }}</option>
        {% endfor %}
    </select>
    <label for="date_heure">Date et heure :</label>
    <input type="datetime-local" id="date_heure" name="date_heure" value="{{ appointment[2] }}" required>
    <label for="statut">Statut :</label>
    <input type="text" id="statut" name="statut" value="{{ appointment[3] }}" required>
    <button type="submit">Modifier</button>
</form>
